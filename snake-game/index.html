<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Snake</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230f172a'/%3E%3Crect x='6' y='14' width='8' height='8' fill='%2322c55e'/%3E%3Crect x='14' y='14' width='8' height='8' fill='%2316a34a'/%3E%3Crect x='22' y='14' width='4' height='4' fill='%23ef4444'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="wrap">
    <header class="hud">
      <div class="stat"><span class="label">Score</span><span id="score">0</span></div>
      <div class="stat"><span class="label">Best</span><span id="best">0</span></div>
      <button id="pauseBtn" class="icon-btn" aria-label="Pause">⏸</button>
    </header>

    <div class="board-holder">
      <canvas id="board" width="400" height="400"></canvas>

      <div id="overlay" class="overlay">
        <h1>Snake</h1>
        <p>Use arrow keys / WASD, or swipe on mobile.</p>
        <button id="startBtn" class="primary-btn">Play</button>
      </div>
    </div>

    <div class="touch-controls" id="touchControls">
      <button class="pad-btn up" data-dir="up" aria-label="Up">▲</button>
      <div class="pad-row">
        <button class="pad-btn left" data-dir="left" aria-label="Left">◀</button>
        <button class="pad-btn down" data-dir="down" aria-label="Down">▼</button>
        <button class="pad-btn right" data-dir="right" aria-label="Right">▶</button>
      </div>
    </div>
  </main>

  <script src="game.js"></script>
</body>
</html>
