<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VoxelCraft</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        font-family: 'Segoe UI', system-ui, sans-serif;
        user-select: none;
      }
      #app { width: 100%; height: 100%; }
      canvas { display: block; }

      #crosshair {
        position: fixed;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        pointer-events: none;
        color: rgba(255, 255, 255, 0.85);
        font-size: 22px;
        line-height: 1;
        text-shadow: 0 0 3px rgba(0, 0, 0, 0.8);
        z-index: 5;
      }

      #hotbar {
        position: fixed;
        left: 50%;
        bottom: 14px;
        transform: translateX(-50%);
        display: flex;
        gap: 4px;
        padding: 4px;
        background: rgba(0, 0, 0, 0.45);
        border-radius: 6px;
        z-index: 5;
      }
      .slot {
        width: 46px;
        height: 46px;
        border: 2px solid rgba(255, 255, 255, 0.35);
        border-radius: 4px;
        box-sizing: border-box;
        position: relative;
        image-rendering: pixelated;
        background-size: cover;
      }
      .slot.selected {
        border-color: #fff;
        box-shadow: 0 0 8px rgba(255, 255, 255, 0.6);
      }
      .slot .key {
        position: absolute;
        top: 1px;
        left: 3px;
        font-size: 11px;
        color: #fff;
        text-shadow: 1px 1px 1px #000;
      }
      .slot .name {
        position: absolute;
        bottom: 1px;
        left: 0;
        right: 0;
        text-align: center;
        font-size: 9px;
        color: #fff;
        text-shadow: 1px 1px 1px #000;
        overflow: hidden;
        white-space: nowrap;
      }

      #overlay {
        position: fixed;
        inset: 0;
        background: rgba(10, 15, 30, 0.75);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: #fff;
        z-index: 10;
        cursor: pointer;
        text-align: center;
      }
      #overlay h1 {
        font-size: 42px;
        margin: 0 0 8px;
        letter-spacing: 2px;
        text-shadow: 2px 2px 0 #2a6e2a, 4px 4px 8px #000;
      }
      #overlay p { margin: 4px 0; color: #cdd6e8; }
      #overlay .hint {
        margin-top: 18px;
        font-size: 20px;
        color: #fff;
        animation: pulse 1.6s infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.4; }
      }

      #debug {
        position: fixed;
        top: 8px;
        left: 8px;
        color: #fff;
        font-size: 12px;
        font-family: monospace;
        text-shadow: 1px 1px 1px #000;
        z-index: 5;
        pointer-events: none;
        white-space: pre;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="crosshair">+</div>
    <div id="hotbar"></div>
    <div id="debug"></div>
    <div id="overlay">
      <h1>VoxelCraft</h1>
      <p>W A S D — move &nbsp;·&nbsp; Space — jump &nbsp;·&nbsp; Shift — sprint</p>
      <p>Left click — break block &nbsp;·&nbsp; Right click — place block</p>
      <p>1–9 / mouse wheel — select block &nbsp;·&nbsp; F — toggle fly &nbsp;·&nbsp; Esc — release mouse</p>
      <div class="hint">Click to play</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
